# Gained on Render, FREE plan (the hackathon deployment): one web service and Postgres.
#
# Render's free plan has no workflow or cron services, so:
#   - background jobs (quiz writing, captures, payouts) run inside the web service
#     (WORKFLOW_MODE=inline, lib/jobs.ts);
#   - the every-15-minutes work runs via POST /api/cron, called by a scheduled GitHub Action
#     (.github/workflows/scheduled-tasks.yml), which also keeps the free web service awake.
# Free limits: the database expires 30 days after creation.
# render.production.yaml is the paid setup with a separate workflow service and cron job.
# Secrets marked `sync: false` are entered in the Render dashboard when the Blueprint is created;
# leave any you don't have yet blank and add them later under the service's Environment tab.

databases:
  - name: gained-db
    databaseName: gained
    plan: free
    region: oregon

services:
  - type: web
    name: gained-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    # Free web services have no pre-deploy step, so migrations run just before the server starts.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: gained-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Shared with the GitHub Action that calls /api/cron.
      - key: CRON_SECRET
        generateValue: true
      - key: WORKFLOW_MODE
        value: inline
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      # Quizzes, topics and grading run through Elastic (lib/elastic.ts).
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      # Email (lib/mail.ts). Set BREVO_API_KEY or RESEND_API_KEY; without either, emails go to the
      # service log instead.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: AG_STUDIO
        sync: false
      # Bryntum licence key for the booking and availability calendars (components/scheduler/license.ts).
      - key: NEXT_PUBLIC_BRYNTUM_LICENSE_KEY
        sync: false
